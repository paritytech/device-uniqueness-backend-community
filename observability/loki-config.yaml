# Loki: single-binary, filesystem-backed log store for one host. No cluster, no
# object store — the rings below exist only because Loki insists on them.

auth_enabled: false

server:
  http_listen_port: 3100
  # A broken Loki shows up as a gap in the graphs, not as chatter in its own log.
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # 14 days: enough to answer "what happened last week", small enough for a
  # testnet box. Written here rather than passed in, so the retention actually
  # in force is readable in the committed config. Raise it with the disk.
  retention_period: 336h
  # Everything ships live from Alloy, so an old sample is a clock problem.
  reject_old_samples: true
  reject_old_samples_max_age: 24h
  allow_structured_metadata: true
  volume_enabled: true

compactor:
  working_directory: /loki/compactor
  # Without this, retention_period is advisory and the disk fills.
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
