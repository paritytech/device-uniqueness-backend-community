name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: The ref to check out. Defaults to the caller's ref.
        required: false
        type: string

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: always

jobs:
  offline:
    # Each network compiles differently (vendored metadata, invite-tickets
    # roles), so each one is linted and tested as its own build.
    strategy:
      fail-fast: false
      matrix:
        network: [testnet, polkadot]
    runs-on: ubuntu-latest
    env:
      DUB_NETWORK: ${{ matrix.network }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Reclaim runner disk
        run: |
          df -h /
          # Preinstalled toolchains this workspace never uses. `|| true`: the
          # image's contents change, and a missing directory is not a failure.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: compose configuration boundaries
        run: scripts/verify_compose_boundaries.sh

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.network }}

      - name: role split
        run: scripts/verify_role_split.sh

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: tests
        run: cargo test --workspace

      - name: disk usage after tests
        if: always()
        run: df -h /

  helm:
    # The chart's render-time guards are the deploy path's last line against a
    # published dev credential; prove the example renders and that each
    # published value is refused. helm is preinstalled on ubuntu-latest.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: chart guards
        run: |
          set -euo pipefail
          helm version --short
          base=(template guard helm -f helm/values-example.yaml --set global.imageTag=ci)
          helm "${base[@]}" > /dev/null
          refuse() {
            if helm "${base[@]}" --set-string "$1" > /dev/null 2>&1; then
              echo "::error::the chart rendered with a published dev value: $1"
              exit 1
            fi
          }
          refuse 'secrets.device-attestation-api.JWT_ED25519_SECRET=0x0101010101010101010101010101010101010101010101010101010101010101'
          refuse 'secrets.device-attestation-api.JWT_ED25519_SECRET=AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE='
          refuse 'secrets.turn-api.TURN_SECRET=ZGV2LW9ubHktdHVybi1zZWNyZXQtY2hhbmdlLW1l'
          refuse 'global.env.JWT_ED25519_PUBLIC_KEY=0x8a88e3dd7409f195fd52db2d3cba5d72ca6709bf1d94121bf3748801b40f6f5c'
          # DeviceCheck enabled without an explicit posture (security_findings#141).
          refuse 'workloads.device-attestation-api.env.DEVICE_CHECK_IOS_ENABLED=true'
          echo "chart guards: ok"

  database:
    needs: offline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: Swatinem/rust-cache@v2
      - name: database integration tests
        run: scripts/run_live_suites.sh db cargo test

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check --allow unmaintained --allow vulnerability
