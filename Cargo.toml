[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
# The released version, and the only place it is written down: release.yml
# refuses a `v*` tag that disagrees with it, so a release is always a commit
# that bumped this line. Pre-1.0, breaking changes bump the minor.
version = "0.5.0"
edition = "2021"
rust-version = "1.95"
license = "GPL-3.0-only"
# Private workspace: none of these crates are published to crates.io.
publish = false

[workspace.dependencies]
chain-types = { path = "crates/chain-types" }
chain-client = { path = "crates/chain-client" }
jwt-verify = { path = "crates/jwt-verify" }
http-common = { path = "crates/http-common" }

subxt = { version = "0.50.3", default-features = false, features = [
    "native",
    "reconnecting-rpc-client",
] }
subxt-rpcs = { version = "0.50.3", default-features = false, features = [
    "native",
    "reconnecting-rpc-client",
] }
subxt-signer = { version = "0.50.3", default-features = false, features = [
    "sr25519",
    "std",
] }

# Ring-VRF personhood-proof verification. Pinned to the revision the People
# Chain runtime pins (the 288-byte `MembersCommitment` encoding); verify-only
# consumers keep default features off (no prover, no SRS data).
verifiable = { git = "https://github.com/paritytech/verifiable", rev = "1f9f67524acce0d9c46dbbb566f84ce52757b114", default-features = false }

tokio = { version = "1", features = ["full"] }
axum = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
utoipa = { version = "5", features = ["axum_extras", "preserve_order"] }
metrics = "0.24"

# Rate limiting 
moka = "0.12.16"
governor = "0.10.4"
client-ip = "0.2.1"

# The exporter's own hyper listener is unused: the recorder handle is rendered
# from our axum `/metrics` route, so the http-listener/push-gateway defaults
# (a second HTTP stack) stay off.
metrics-exporter-prometheus = { version = "0.18", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
uninlined_format_args = "warn"
