[package]
name = "notifications"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autobins = false

# notifications is a thin, stateless, DB-free `/api/v1/notify` relay: it verifies
# an device-attestation JWT with public-key material only, preserves the frozen
# mobile request/response contract, and hands the flat payload to a push provider.
# The iOS (APNs) provider is real; the Android (FCM) provider lands in a later phase.
#
# A library only: the deployable `notify-relay` service is a role of the `dub`
# binary (`crates/dub`), entered through this crate's `routes()`.
[lib]
path = "src/lib.rs"

[dependencies]
jwt-verify.workspace = true
http-common.workspace = true
tokio.workspace = true
axum.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
utoipa.workspace = true
time = "0.3"
# APNs HTTP/2 transport + ES256 provider-token signing from the .p8 key.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
jsonwebtoken = "11"

[dev-dependencies]
base64 = "0.22"
ed25519-dalek = "2"

[lints]
workspace = true
