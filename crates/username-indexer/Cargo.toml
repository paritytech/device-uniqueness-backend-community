[package]
name = "username-indexer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autobins = false

# A library only: the deployable `username-indexer` service is a role of the
# `dub` binary (`crates/dub`), entered through this crate's `routes()`.
[lib]
path = "src/lib.rs"

[dependencies]
chain-types.workspace = true
http-common.workspace = true
metrics.workspace = true
jwt-verify.workspace = true
subxt.workspace = true
subxt-rpcs.workspace = true

tokio.workspace = true
axum.workspace = true
tower-http = { version = "0.6", features = ["trace", "timeout", "request-id"] }
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
utoipa.workspace = true

sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "macros",
    "migrate",
    "time",
    "uuid",
] }
base64 = "0.22"
blake2 = "0.10"
bs58 = "0.5"
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
time = { version = "0.3", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }

[[example]]
name = "poc_solve"
path = "examples/poc_solve.rs"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
ed25519-dalek = "2"
subxt-rpcs = { workspace = true, features = ["mock-rpc-client"] }

[lints]
workspace = true