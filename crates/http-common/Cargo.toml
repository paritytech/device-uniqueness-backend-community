# Shared axum primitives for the services' HTTP surface, extracted once a
# second service needed the same scaffolding (the same lazy-extraction rule
# that produced `jwt-verify`/`chain-client`).
# Transport-shape only: no domain logic, no DB schema, no chain types.
[package]
name = "http-common"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
jwt-verify.workspace = true

axum.workspace = true
tokio = { workspace = true }
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
tower-http = { version = "0.6", features = ["trace", "timeout", "request-id"] }
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
ed25519-dalek = "2"
hex = "0.4"
moka = { workspace = true, features = ["sync", "quanta"] }
governor = { workspace = true, features = ["quanta", "jitter", "std"] }
client-ip = { workspace = true }

[lints]
workspace = true
