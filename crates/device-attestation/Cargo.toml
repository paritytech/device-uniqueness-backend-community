[package]
name = "device-attestation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autobins = false

# device-attestation is a library (shared domain: auth, usernames, outbox) plus
# the `voucher-mint` operator CLI.
#
# Its three deployable services — the N-replica `device-attestation-api`, the
# single-instance `device-attestation-chain-writer` that drains the reservation outbox
# onto People Chain, and the single-instance `registration-queue` advancer
# (optional at runtime — when it is down, api + writer fall back to the direct
# registration path) — are ROLES of the `dub` binary (`crates/dub`), not
# binaries of their own. Their entry points here are the library's `routes()`
# and `run()`, which is what the integration suites exercise.
[lib]
path = "src/lib.rs"

# Operator CLI (not a service): mints registration vouchers for the INSTANT
# lane. No HTTP surface by design — see the bin's docs.
[[bin]]
name = "voucher-mint"
path = "src/bin/voucher_mint.rs"

[dependencies]
chain-types.workspace = true
chain-client.workspace = true
jwt-verify.workspace = true
http-common.workspace = true
metrics.workspace = true
subxt = { workspace = true, features = ["jsonrpsee"] }
subxt-rpcs.workspace = true
subxt-signer = { workspace = true, features = ["subxt"] }

tokio.workspace = true
axum.workspace = true
tower-http = { version = "0.6", features = ["trace", "timeout", "request-id"] }
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
utoipa.workspace = true

sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "macros",
    "migrate",
    "time",
] }
ed25519-dalek = { version = "2", features = ["pkcs8"] }
base64 = "0.22"
sha2 = "0.10"
# Payment lane: deposit-account derivation (blake2_256 of the
# pallet_multisig entropy tuple and of the keyless dummy signatory).
blake2 = "0.10"
hex = "0.4"
rand = "0.8"
time = "0.3"
futures = "0.3"
# Keep secret config (JWT seed, DB URL, decryption/DeviceCheck keys) out of logs:
# opaque Debug + zeroize-on-drop, exposed only via `.expose_secret()`.
secrecy = "0.10"

# Platform attestation verification (iOS App Attest + Android key attestation):
# CBOR envelope, X.509/ASN.1 parsing, ECDSA P-256/P-384, and RSA (the classic
# Google key-attestation root is RSA).
ciborium = "0.2"
x509-parser = "0.17"
p256 = { version = "0.13", default-features = false, features = [
    "ecdsa",
    "std",
    "pkcs8",
    "pem",
] }
p384 = { version = "0.13", default-features = false, features = [
    "ecdsa",
    "std",
] }
rsa = { version = "0.9", default-features = false, features = ["std", "sha2"] }
# Android attestation CRL fetch (https://android.googleapis.com/attestation/status).
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
# Play Integrity self-managed keys: the classic token is a JWE (A256KW + A256GCM)
# wrapping a JWS (ES256) verdict, decrypted/verified locally — no Google API call.
aes-gcm = "0.10"
aes-kw = { version = "0.2", features = ["std"] }
# Temporary Google decodeIntegrityToken fallback (until the Play Console
# self-managed key exchange lands): RS256 service-account assertion.
jsonwebtoken = "9"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
subxt-rpcs = { workspace = true, features = ["mock-rpc-client"] }
# Synthetic Apple-style attestation cert chains for App Attest verify tests.
rcgen = "0.13"

[lints]
workspace = true
